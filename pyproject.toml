[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-agent-cli"
version = "0.1.0"
description = "Durable local message queue and CLI agent router for channels"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atrium = "channel_cli.cli:main"
channel = "channel_cli.cli:main"

[tool.setuptools.packages.find]
include = ["channel_cli*"]
